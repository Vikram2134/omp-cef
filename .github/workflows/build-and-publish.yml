name: XEO v1.3.0 Cef 6675 Build

on:
  push:
    branches: ['xeo-v1.3.0-6675']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build v1.3.0 Cef.so (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config curl zip unzip tar jq

      - name: Bootstrap vcpkg
        run: |
          set -e
          VCPKG_DIR="$GITHUB_WORKSPACE/vcpkg"
          BASELINE=$(jq -r '."builtin-baseline"' vcpkg.json)
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          git -C "$VCPKG_DIR" checkout "$BASELINE"
          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_DIR" >> "$GITHUB_ENV"

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ~/.cache/vcpkg/archives
          key: vcpkg-v130-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-v130-${{ runner.os }}-

      - name: Configure v1.3.0 server component
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_MANIFEST_FEATURES=server \
            -DBUILD_SERVER_OMP=ON

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Stage Cef.so
        run: |
          mkdir -p artifact-stage
          find build -path '*/server/*' -name '*.so' -exec cp {} artifact-stage/ \;
          ls -lah artifact-stage/
          test -n "$(find artifact-stage -maxdepth 1 -name '*.so' -print -quit)" || (echo "::error::No server .so produced"; exit 1)

      - name: Upload XEO v1.3.0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: XEO-Cef-v1.3.0-port-6675
          path: artifact-stage/*.so
          if-no-files-found: error
