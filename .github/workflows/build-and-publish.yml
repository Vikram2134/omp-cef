name: Build & Publish

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build cef.so (linux x64, vcpkg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config curl zip unzip tar

      - name: Bootstrap vcpkg
        run: |
          set -e
          VCPKG_DIR="$GITHUB_WORKSPACE/vcpkg"
          BASELINE=$(jq -r '."builtin-baseline"' vcpkg.json)
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          git -C "$VCPKG_DIR" checkout "$BASELINE"
          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_DIR" >> "$GITHUB_ENV"

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_MANIFEST_FEATURES=server \
            -DBUILD_SERVER_OMP=ON

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Stage artifact
        run: |
          mkdir -p artifact-stage
          find build -path '*/server/*' -name '*.so' -exec cp {} artifact-stage/ \;
          ls -la artifact-stage/
          test -n "$(ls -A artifact-stage/)" || (echo "::error::no .so produced under build/**/server/"; exit 1)

      - name: Upload XEO Cef.so
        uses: actions/upload-artifact@v4
        with:
          name: XEO-Cef-port-6675
          path: artifact-stage/*.so
          if-no-files-found: error
